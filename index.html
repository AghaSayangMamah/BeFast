<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyBeFast - Auth Nomor HP</title>
  
  <!-- Load Supabase JS SDK v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2, h3 {
      text-align: center;
      color: #333;
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #555;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #007bff;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }
    .btn-danger {
      background-color: #dc3545;
      margin-top: 15px;
    }
    .btn-danger:hover {
      background-color: #bd2130;
    }
    .toggle-link {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
    .toggle-link a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .status-card {
      background-color: #e9ecef;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      font-size: 14px;
      word-break: break-all;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>MyBeFast Auth</h2>

    <!-- FORM REGISTER -->
    <div id="register-box">
      <h3>Daftar Akun Baru</h3>
      <div class="form-group">
        <label for="reg-name">Nama Lengkap</label>
        <input type="text" id="reg-name" placeholder="Masukkan nama lengkap" />
      </div>
      <div class="form-group">
        <label for="reg-phone">Nomor HP</label>
        <input type="tel" id="reg-phone" placeholder="Contoh: 08123456789" />
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="Minimal 6 karakter" />
      </div>
      <button id="btn-register" onclick="signUpWithPhone()">Daftar & Masuk</button>
      <div class="toggle-link">
        Sudah punya akun? <a href="javascript:void(0)" onclick="showLogin()">Login di sini</a>
      </div>
    </div>

    <!-- FORM LOGIN -->
    <div id="login-box" class="hidden">
      <h3>Login</h3>
      <div class="form-group">
        <label for="login-phone">Nomor HP</label>
        <input type="tel" id="login-phone" placeholder="Contoh: 08123456789" />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Masukkan password" />
      </div>
      <button id="btn-login" onclick="signInWithPhone()">Masuk</button>
      <div class="toggle-link">
        Belum punya akun? <a href="javascript:void(0)" onclick="showRegister()">Daftar di sini</a>
      </div>
    </div>

    <!-- DASHBOARD STATUS USER -->
    <div id="user-box" class="hidden">
      <h3>Status Sesi</h3>
      <div class="status-card" id="user-info">
        Memuat data...
      </div>
      <button class="btn-danger" onclick="signOut()">Logout</button>
    </div>
  </div>

  <script>
    // =========================================================
    // ISIKAN KREDENSIAL SUPABASE MILIKMU DI SINI:
    // =========================================================
    const SUPABASE_URL = 'https://cpxtmplxgharspotisti.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNweHRtcGx4Z2hhcnNwb3Rpc3RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NzA5MTAsImV4cCI6MjEwNDQ0NjkxMH0.vR9BY365MPGD9h71_IieYVGH_d7-ow_ZjOUOY7RbO-s';

    let supabaseClient = null;

    // Inisialisasi Klien Supabase (Nama variabel diubah agar tidak bentrok)
    try {
      if (!SUPABASE_URL.includes('YOUR_PROJECT_ID')) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } else {
        console.warn('Peringatan: URL Supabase belum diisi dengan benar!');
      }
    } catch (err) {
      console.error('Gagal inisialisasi Supabase:', err);
    }

    // Convert No HP ke Email internal
    function phoneToEmail(phone) {
      const cleanPhone = phone.replace(/[^0-9]/g, '');
      return `${cleanPhone}@mybefast.com`;
    }

    // Navigation Toggle
    function showLogin() {
      document.getElementById('register-box').classList.add('hidden');
      document.getElementById('login-box').classList.remove('hidden');
    }

    function showRegister() {
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('register-box').classList.remove('hidden');
    }

    // 1. FUNGSI REGISTRASI
    async function signUpWithPhone() {
      if (!supabaseClient) {
        alert('Kredensial Supabase belum diisi di dalam kode!');
        return;
      }

      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('btn-register');

      if (!name || !phone || !password) {
        alert('Harap isi semua kolom!');
        return;
      }

      try {
        btn.disabled = true;
        btn.innerText = 'Memproses...';

        const email = phoneToEmail(phone);

        // A. Buat akun di Auth
        const { data: authData, error: authError } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
        });

        if (authError) throw authError;

        // B. Simpan data ke tabel profiles
        if (authData.user) {
          const { error: profileError } = await supabaseClient
            .from('profiles')
            .insert([{ id: authData.user.id, phone_number: phone, full_name: name }]);

          if (profileError) throw profileError;

          alert('Pendaftaran Berhasil! Kamu otomatis masuk.');
          checkUser();
        }
      } catch (err) {
        alert('Gagal Daftar: ' + err.message);
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Daftar & Masuk';
      }
    }

    // 2. FUNGSI LOGIN
    async function signInWithPhone() {
      if (!supabaseClient) {
        alert('Kredensial Supabase belum diisi!');
        return;
      }

      const phone = document.getElementById('login-phone').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');

      if (!phone || !password) {
        alert('Isi Nomor HP dan Password!');
        return;
      }

      try {
        btn.disabled = true;
        btn.innerText = 'Memuat...';

        const email = phoneToEmail(phone);

        const { error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) throw error;

        alert('Login Berhasil!');
        checkUser();
      } catch (err) {
        alert('Login Gagal: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Masuk';
      }
    }

    // 3. FUNGSI CEK SESI
    async function checkUser() {
      if (!supabaseClient) return;

      const { data: { user } } = await supabaseClient.auth.getUser();

      if (user) {
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('id', user.id)
          .single();

        document.getElementById('register-box').classList.add('hidden');
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('user-box').classList.remove('hidden');

        document.getElementById('user-info').innerHTML = `
          <strong>Status:</strong> Terautentikasi<br>
          <strong>Nama:</strong> ${profile?.full_name || '-'}<br>
          <strong>No. HP:</strong> ${profile?.phone_number || '-'}<br>
          <strong>ID User:</strong> ${user.id}
        `;
      } else {
        document.getElementById('user-box').classList.add('hidden');
        document.getElementById('register-box').classList.remove('hidden');
      }
    }

    // 4. FUNGSI LOGOUT
    async function signOut() {
      if (!supabaseClient) return;
      await supabaseClient.auth.signOut();
      alert('Berhasil Logout');
      checkUser();
    }

    // Jalankan pengecekan sesi saat halaman dibuka
    checkUser();
  </script>
</body>
</html>

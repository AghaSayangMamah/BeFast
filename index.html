<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login & Register - MyBeFast</title>
  <!-- Load Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2, h3 {
      text-align: center;
      color: #333;
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #555;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #007bff;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      margin-top: 10px;
    }
    .btn-secondary:hover {
      background-color: #5a6268;
    }
    .btn-danger {
      background-color: #dc3545;
      margin-top: 10px;
    }
    .btn-danger:hover {
      background-color: #bd2130;
    }
    .toggle-link {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
    .toggle-link a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .status-card {
      background-color: #e9ecef;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      font-size: 14px;
      word-break: break-all;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>MyBeFast Auth</h2>

    <!-- FORM REGISTER -->
    <div id="register-box">
      <h3>Daftar Akun Baru</h3>
      <div class="form-group">
        <label for="reg-name">Nama Lengkap</label>
        <input type="text" id="reg-name" placeholder="Masukkan nama lengkap" />
      </div>
      <div class="form-group">
        <label for="reg-phone">Nomor HP</label>
        <input type="tel" id="reg-phone" placeholder="Contoh: 08123456789" />
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="Minimal 6 karakter" />
      </div>
      <button onclick="signUpWithPhone()">Daftar & Masuk</button>
      <div class="toggle-link">
        Sudah punya akun? <a href="#" onclick="showLogin()">Login di sini</a>
      </div>
    </div>

    <!-- FORM LOGIN -->
    <div id="login-box" class="hidden">
      <h3>Login</h3>
      <div class="form-group">
        <label for="login-phone">Nomor HP</label>
        <input type="tel" id="login-phone" placeholder="Contoh: 08123456789" />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Masukkan password" />
      </div>
      <button onclick="signInWithPhone()">Masuk</button>
      <div class="toggle-link">
        Belum punya akun? <a href="#" onclick="showRegister()">Daftar di sini</a>
      </div>
    </div>

    <!-- DASHBOARD / STATUS AKUN -->
    <div id="user-box" class="hidden">
      <h3>Info Sesi Aktif</h3>
      <div class="status-card" id="user-info">
        Memuat data...
      </div>
      <button class="btn-danger" onclick="signOut()">Logout</button>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIG: GANTI DENGAN KREDENSIAL SUPABASE-MU
    // ==========================================
    const SUPABASE_URL = 'https://cpxtmplxgharspotisti.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNweHRtcGx4Z2hhcnNwb3Rpc3RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NzA5MTAsImV4cCI6MjEwNDQ0NjkxMH0.vR9BY365MPGD9h71_IieYVGH_d7-ow_ZjOUOY7RbO-s';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Fungsi konversi nomor HP ke format email internal Supabase
    function phoneToEmail(phone) {
      const cleanPhone = phone.replace(/[^0-9]/g, '');
      return `${cleanPhone}@mybefast.com`;
    }

    // Toggle Tampilan Form
    function showLogin() {
      document.getElementById('register-box').classList.add('hidden');
      document.getElementById('login-box').classList.remove('hidden');
    }

    function showRegister() {
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('register-box').classList.remove('hidden');
    }

    // 1. DAFTAR BARU
    async function signUpWithPhone() {
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;

      if (!name || !phone || !password) {
        alert('Semua kolom wajib diisi!');
        return;
      }

      const email = phoneToEmail(phone);

      // Mendaftar ke Supabase Auth
      const { data: authData, error: authError } = await supabase.auth.signUp({
        email: email,
        password: password,
      });

      if (authError) {
        alert('Gagal Daftar: ' + authError.message);
        return;
      }

      // Menyimpan detail ke tabel profiles
      const user = authData.user;
      if (user) {
        const { error: profileError } = await supabase
          .from('profiles')
          .insert([{ id: user.id, phone_number: phone, full_name: name }]);

        if (profileError) {
          alert('Gagal simpan profil: ' + profileError.message);
          return;
        }

        alert('Pendaftaran berhasil! Kamu langsung login.');
        checkUser();
      }
    }

    // 2. LOGIN
    async function signInWithPhone() {
      const phone = document.getElementById('login-phone').value.trim();
      const password = document.getElementById('login-password').value;

      if (!phone || !password) {
        alert('Nomor HP dan Password harus diisi!');
        return;
      }

      const email = phoneToEmail(phone);

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        alert('Login Gagal: ' + error.message);
      } else {
        alert('Login Berhasil!');
        checkUser();
      }
    }

    // 3. CEK STATUS LOGIN
    async function checkUser() {
      const { data: { user } } = await supabase.auth.getUser();

      if (user) {
        // Ambil data profil dari tabel
        const { data: profile } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', user.id)
          .single();

        document.getElementById('register-box').classList.add('hidden');
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('user-box').classList.remove('hidden');

        document.getElementById('user-info').innerHTML = `
          <strong>Nama:</strong> ${profile?.full_name || '-'}<br>
          <strong>No. HP:</strong> ${profile?.phone_number || '-'}<br>
          <strong>ID User:</strong> ${user.id}
        `;
      } else {
        document.getElementById('user-box').classList.add('hidden');
        document.getElementById('register-box').classList.remove('hidden');
      }
    }

    // 4. LOGOUT
    async function signOut() {
      await supabase.auth.signOut();
      alert('Berhasil Logout');
      checkUser();
    }

    // Cek status login saat halaman pertama kali dimuat
    checkUser();
  </script>
</body>
</html>

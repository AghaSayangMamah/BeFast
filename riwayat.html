<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Riwayat Transaksi - BeFAST</title>
  
  <link rel="icon" type="image/png" href="LOGO FIX.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen pb-10">

  <!-- Header Sederhana dengan Tombol Back yang Pasti Bisa Diklik -->
  <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-[100] border-b border-gray-200">
    <div class="max-w-[1200px] mx-auto px-4 py-4 flex items-center justify-between relative">
      <div class="flex items-center gap-4 relative z-10">
        <a href="index.html" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-blue-100 hover:text-blue-600 transition cursor-pointer relative z-20">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="text-xl font-black text-[#1e3a8a]">Semua Transaksi</h1>
      </div>
      <img src="mascot-3d.png" alt="BeFAST" class="w-10 h-10 object-contain drop-shadow-sm">
    </div>
  </header>

  <!-- Konten Riwayat -->
  <main class="max-w-[1200px] mx-auto px-4 pt-8">
    <!-- KOTAK PENCARIAN REAL-TIME -->
    <div class="w-full flex justify-end mb-4">
      <div class="relative group w-full sm:w-64">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 group-focus-within:text-[#1e3a8a] transition-colors"></i>
        <input type="text" id="searchHistory" placeholder="Cari transaksi..." class="pl-11 pr-4 py-2.5 w-full rounded-full bg-white border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#1e3a8a]/50 text-sm font-semibold transition-all shadow-sm text-gray-700">
      </div>
    </div>
    
    <div class="glass-panel p-4 md:p-6 overflow-hidden">
      
      <!-- 1. TAMPILAN TABEL (Hanya muncul khusus di Desktop / md ke atas) -->
      <div class="hidden md:block overflow-x-auto no-scrollbar">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b-2 border-gray-200 text-gray-500 text-xs uppercase tracking-wider">
              <th class="p-3 font-black">Tanggal</th>
              <th class="p-3 font-black">Jenis</th>
              <th class="p-3 font-black">Kategori</th>
              <th class="p-3 font-black">Keterangan</th>
              <th class="p-3 font-black text-right">Nominal (Rp)</th>
              <th class="p-3 font-black text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBodyDesktop" class="text-sm">
            <tr><td colspan="6" class="p-6 text-center text-gray-400 font-bold">Memuat data dari database...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- 2. TAMPILAN CARD (Hanya muncul khusus di Mobile / Layar HP) -->
      <div id="tableBodyMobile" class="md:hidden flex flex-col gap-3">
        <p class="p-6 text-center text-gray-400 font-bold">Memuat data dari database...</p>
      </div>

    </div>
  </main>

  <div id="historyDeleteModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md flex items-center justify-center hidden z-[120] p-4" role="dialog" aria-modal="true" aria-labelledby="historyDeleteTitle">
    <div class="theme-card w-full max-w-sm p-6 rounded-3xl shadow-2xl text-center">
      <div class="w-14 h-14 mx-auto mb-4 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center text-2xl"><i class="fa-solid fa-trash-can"></i></div>
      <h2 id="historyDeleteTitle" class="font-black text-lg theme-text mb-2">Hapus transaksi?</h2>
      <p id="historyDeleteDetails" class="text-sm theme-text-muted mb-6"></p>
      <div class="flex gap-3">
        <button type="button" onclick="closeHistoryDeleteModal()" class="flex-1 py-3 bg-white text-gray-800 border border-gray-200 font-bold rounded-xl hover:bg-gray-100 transition text-sm">Batal</button>
        <button id="confirmHistoryDeleteButton" type="button" onclick="confirmHistoryDelete()" class="flex-1 py-3 bg-red-500 text-white font-bold rounded-xl hover:bg-red-600 transition text-sm">Iya, Hapus</button>
      </div>
    </div>
  </div>

  <div id="historyToast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white px-5 py-3 rounded-2xl shadow-2xl z-[130] hidden flex items-center gap-4 max-w-[calc(100%-2rem)]" role="status" aria-live="polite">
    <span id="historyToastMessage" class="text-xs font-semibold"></span>
    <button id="undoHistoryDeleteButton" type="button" onclick="undoHistoryDelete()" class="hidden bg-[#496af1] hover:opacity-80 text-white text-xs font-black px-3 py-1.5 rounded-xl transition shadow-sm">Batalkan</button>
  </div>

  <!-- Menggunakan config.js untuk koneksi database -->
  <script src="js/config.js"></script>
  
  <script>
    let historyTransactions = [];
    let pendingHistoryDelete = null;
    let deletedHistoryTransaction = null;
    let historyUndoTimer = null;

    document.addEventListener('DOMContentLoaded', loadHistoryTransactions);

    async function loadHistoryTransactions() {
      const userStr = localStorage.getItem('bf_user');
      if (!userStr || !supabaseClient) {
        window.location.href = 'index.html'; 
        return;
      }
      
      try {
        const user = JSON.parse(userStr);
        const { data, error } = await supabaseClient
          .from('transactions')
          .select('*')
          .eq('user_id', user.id)
          .order('date', { ascending: false });

        if (error) throw error;
        historyTransactions = data || [];
        renderHistoryTransactions();
      } catch (error) {
        console.error('Gagal memuat riwayat transaksi:', error);
        renderHistoryMessage('Gagal memuat data. Periksa koneksi lalu muat ulang halaman.', true);
      }
    }

    function renderHistoryMessage(message, isError = false) {
      const desktopBody = document.getElementById('tableBodyDesktop');
      const mobileBody = document.getElementById('tableBodyMobile');
      desktopBody.replaceChildren();
      mobileBody.replaceChildren();

      const desktopMessage = document.createElement('tr');
      const desktopCell = document.createElement('td');
      desktopCell.colSpan = 6;
      desktopCell.className = `p-6 text-center font-bold ${isError ? 'text-red-500' : 'text-gray-400'}`;
      desktopCell.textContent = message;
      desktopMessage.appendChild(desktopCell);
      desktopBody.appendChild(desktopMessage);

      const mobileMessage = document.createElement('p');
      mobileMessage.className = `p-6 text-center font-bold ${isError ? 'text-red-500' : 'text-gray-400'}`;
      mobileMessage.textContent = message;
      mobileBody.appendChild(mobileMessage);
    }

    function renderHistoryTransactions() {
      const desktopBody = document.getElementById('tableBodyDesktop');
      const mobileBody = document.getElementById('tableBodyMobile');
      desktopBody.replaceChildren();
      mobileBody.replaceChildren();

      if (!historyTransactions.length) {
        renderHistoryMessage('Belum ada riwayat transaksi.');
        return;
      }

      historyTransactions.forEach((transaction, index) => {
        const isIncome = transaction.type === 'pemasukan';
        const rowBg = index % 2 === 0 ? 'bg-transparent' : 'bg-gray-50/50';
        const tr = document.createElement('tr');
        tr.className = `border-b border-gray-100 hover:bg-blue-50/50 transition ${rowBg} searchable-row`;

        const dateCell = document.createElement('td');
        dateCell.className = 'p-3 font-semibold text-gray-600 whitespace-nowrap';
        dateCell.textContent = transaction.date || '-';
        const typeCell = document.createElement('td');
        typeCell.className = 'p-3';
        const typeBadge = document.createElement('span');
        typeBadge.className = `${isIncome ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider`;
        typeBadge.textContent = isIncome ? 'Pemasukan' : 'Pengeluaran';
        typeCell.appendChild(typeBadge);
        const categoryCell = document.createElement('td');
        categoryCell.className = 'p-3 font-bold text-gray-700 whitespace-nowrap';
        categoryCell.textContent = transaction.category || '-';
        const descriptionCell = document.createElement('td');
        descriptionCell.className = 'p-3 font-semibold text-gray-800';
        descriptionCell.textContent = transaction.desc || '-';
        const amountCell = document.createElement('td');
        amountCell.className = `p-3 font-black ${isIncome ? 'text-green-600' : 'text-red-600'} text-right whitespace-nowrap`;
        amountCell.textContent = `${isIncome ? '+' : '-'} Rp ${Number(transaction.amount).toLocaleString('id-ID')}`;
        const actionCell = document.createElement('td');
        actionCell.className = 'p-3 text-center';
        actionCell.appendChild(createHistoryDeleteButton(transaction.id, false));
        tr.append(dateCell, typeCell, categoryCell, descriptionCell, amountCell, actionCell);
        desktopBody.appendChild(tr);

        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between searchable-row';
        const details = document.createElement('div');
        details.className = 'flex flex-col gap-1 min-w-0 pr-3';
        const metadata = document.createElement('div');
        metadata.className = 'flex items-center gap-2';
        const mobileBadge = typeBadge.cloneNode(true);
        const mobileDate = document.createElement('span');
        mobileDate.className = 'text-[10px] text-gray-400 font-semibold';
        mobileDate.textContent = `• ${transaction.date || '-'}`;
        metadata.append(mobileBadge, mobileDate);
        const mobileDescription = document.createElement('h4');
        mobileDescription.className = 'font-bold text-sm text-gray-800 truncate mt-0.5';
        mobileDescription.textContent = transaction.desc || '-';
        const mobileCategory = document.createElement('p');
        mobileCategory.className = 'text-[10px] text-gray-500 font-medium';
        mobileCategory.textContent = transaction.category || '-';
        details.append(metadata, mobileDescription, mobileCategory);

        const mobileAmountArea = document.createElement('div');
        mobileAmountArea.className = 'flex flex-col items-end shrink-0';
        const mobileAmount = document.createElement('p');
        mobileAmount.className = `font-black text-sm ${isIncome ? 'text-green-600' : 'text-red-600'}`;
        mobileAmount.textContent = amountCell.textContent;
        mobileAmountArea.append(mobileAmount, createHistoryDeleteButton(transaction.id, true));
        card.append(details, mobileAmountArea);
        mobileBody.appendChild(card);
      });

      applyHistorySearch();
    }

    function createHistoryDeleteButton(id, isMobile) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = isMobile
        ? 'mt-2 w-7 h-7 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition'
        : 'w-8 h-8 rounded-full bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition';
      button.title = 'Hapus transaksi';
      button.setAttribute('aria-label', 'Hapus transaksi');
      const icon = document.createElement('i');
      icon.className = `fa-solid fa-trash ${isMobile ? 'text-[10px]' : 'text-xs'}`;
      button.appendChild(icon);
      button.addEventListener('click', () => openHistoryDeleteModal(id));
      return button;
    }

    function openHistoryDeleteModal(id) {
      pendingHistoryDelete = historyTransactions.find(transaction => String(transaction.id) === String(id)) || null;
      if (!pendingHistoryDelete) return;
      const details = document.getElementById('historyDeleteDetails');
      const amountSign = pendingHistoryDelete.type === 'pemasukan' ? '+' : '-';
      details.textContent = `${pendingHistoryDelete.desc || 'Tanpa keterangan'} · ${amountSign} Rp ${Number(pendingHistoryDelete.amount).toLocaleString('id-ID')} · ${pendingHistoryDelete.date || '-'}`;
      document.getElementById('historyDeleteModal').classList.remove('hidden');
    }

    function closeHistoryDeleteModal() {
      pendingHistoryDelete = null;
      document.getElementById('historyDeleteModal').classList.add('hidden');
    }

    async function confirmHistoryDelete() {
      if (!pendingHistoryDelete) return;
      const button = document.getElementById('confirmHistoryDeleteButton');
      button.disabled = true;
      const transaction = pendingHistoryDelete;

      try {
        const { error } = await supabaseClient.from('transactions').delete().eq('id', transaction.id);
        if (error) throw error;
        historyTransactions = historyTransactions.filter(item => String(item.id) !== String(transaction.id));
        deletedHistoryTransaction = transaction;
        closeHistoryDeleteModal();
        renderHistoryTransactions();
        showHistoryToast(`Transaksi "${transaction.desc || 'Tanpa keterangan'}" dihapus.`, true);
      } catch (error) {
        console.error('Gagal menghapus transaksi dari riwayat:', error);
        closeHistoryDeleteModal();
        showHistoryToast('Gagal menghapus transaksi. Periksa koneksi lalu coba lagi.');
      } finally {
        button.disabled = false;
      }
    }

    function showHistoryToast(message, canUndo = false) {
      const toast = document.getElementById('historyToast');
      document.getElementById('historyToastMessage').textContent = message;
      document.getElementById('undoHistoryDeleteButton').classList.toggle('hidden', !canUndo);
      toast.classList.remove('hidden');
      if (historyUndoTimer) clearTimeout(historyUndoTimer);
      historyUndoTimer = canUndo
        ? setTimeout(() => {
            toast.classList.add('hidden');
            deletedHistoryTransaction = null;
            historyUndoTimer = null;
          }, 8000)
        : setTimeout(() => toast.classList.add('hidden'), 5000);
    }

    async function undoHistoryDelete() {
      if (!deletedHistoryTransaction) return;
      const user = JSON.parse(localStorage.getItem('bf_user') || 'null');
      if (!user) {
        showHistoryToast('Sesi login berakhir. Masuk kembali sebelum membatalkan hapus.');
        return;
      }

      const transaction = deletedHistoryTransaction;
      const button = document.getElementById('undoHistoryDeleteButton');
      button.disabled = true;
      try {
        const restoredTransaction = {
          id: `${Date.now()}${Math.floor(Math.random() * 1000)}`,
          user_id: user.id,
          date: transaction.date,
          type: transaction.type,
          category: transaction.category,
          amount: Number(transaction.amount),
          desc: transaction.desc
        };
        const { error } = await supabaseClient.from('transactions').insert([restoredTransaction]);
        if (error) throw error;

        historyTransactions.push(restoredTransaction);
        deletedHistoryTransaction = null;
        if (historyUndoTimer) clearTimeout(historyUndoTimer);
        historyUndoTimer = null;
        renderHistoryTransactions();
        showHistoryToast('Transaksi berhasil dikembalikan.');
      } catch (error) {
        console.error('Gagal mengembalikan transaksi dari riwayat:', error);
        showHistoryToast('Gagal mengembalikan transaksi. Coba lagi.');
      } finally {
        button.disabled = false;
      }
    }

    function applyHistorySearch() {
      const keyword = document.getElementById('searchHistory').value.toLowerCase();
      document.querySelectorAll('.searchable-row').forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(keyword) ? '' : 'none';
      });
    }

    document.getElementById('searchHistory').addEventListener('input', applyHistorySearch);
  </script>
</body>
</html>
